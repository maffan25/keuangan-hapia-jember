<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kas HAPIA</title>
<meta name="theme-color" content="#0b0c1b">
<link rel="icon" href="assets/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body data-bg="ethereal">
<canvas id="langit" aria-hidden="true"></canvas>
<canvas id="efek" aria-hidden="true"></canvas>

<div class="shell">
<div class="aurora" aria-hidden="true"><i></i><i></i><i></i></div>
<header class="top">
  <a class="brand" href="#/beranda"><span class="logo"><img id="logo" src="assets/logo.png" alt="Logo"></span><b id="brandNama">HAPIA</b></a>
  <nav class="pills" id="nav">
    <span class="ind" aria-hidden="true"></span>
    <a href="#/beranda" data-r="beranda">Dasbor</a>
    <a href="#/event" data-r="event">Event</a>
    <a href="#/transaksi" data-r="transaksi">Transaksi</a>
    <a href="#/laporan" data-r="laporan">Laporan</a>
  </nav>
  <div class="tools">
    <button class="circ" id="cari" aria-label="Cari transaksi"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg></button>
    <button class="circ" id="gear" aria-label="Pengaturan tampilan"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
    <button class="ava" id="ava" aria-label="Profil dan pengaturan">P</button>
  </div>
</header>

<main id="root"></main>
</div>
<button class="fab" id="tambah" aria-label="Catat transaksi"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>

<dialog id="dTrx">
  <form id="fTrx" method="dialog">
    <h2 id="tTrx">Catat transaksi</h2>
    <div class="seg"><label><input type="radio" name="jenis" value="masuk" checked><span>Pemasukan</span></label><label><input type="radio" name="jenis" value="keluar"><span>Pengeluaran</span></label></div>
    <label class="f">Event<select name="event"></select></label>
    <div class="two">
      <label class="f">Kategori<select name="kat" required></select></label>
      <label class="f">Tanggal<input type="date" name="tgl" required></label>
    </div>
    <label class="f">Nominal (Rp)<input name="nominal" inputmode="numeric" placeholder="0" required autocomplete="off"></label>
    <label class="f">Keterangan<input name="ket" maxlength="120" placeholder="Contoh: Iuran Pak Ahmad angkatan 2015"></label>
    <div class="act"><button type="button" class="btn soft" data-close>Batal</button><button class="btn lime">Simpan</button></div>
  </form>
</dialog>

<dialog id="dEvt">
  <form id="fEvt" method="dialog">
    <h2 id="tEvt">Event baru</h2>
    <label class="f">Nama event<input name="nama" required maxlength="60" placeholder="Contoh: Halal Bihalal 2026"></label>
    <div class="two">
      <label class="f">Tanggal<input type="date" name="tgl" required></label>
      <label class="f">Anggaran (opsional)<input name="anggaran" inputmode="numeric" placeholder="0" autocomplete="off"></label>
    </div>
    <label class="f">Catatan<input name="cat" maxlength="140" placeholder="Tempat, panitia, atau keterangan lain"></label>
    <div class="act"><button type="button" class="btn soft" data-close>Batal</button><button class="btn lime">Simpan event</button></div>
  </form>
</dialog>

<dialog id="dSet" class="wide">
  <form id="fSet" method="dialog">
    <h2>Pengaturan tampilan</h2>
    <h3>Identitas</h3>
    <label class="f">Nama aplikasi atau organisasi<input name="nama" maxlength="28" placeholder="HAPIA"></label>
    <div class="two">
      <label class="f">Subjudul<input name="tagline" maxlength="40" placeholder="Kas &amp; Keuangan"></label>
      <label class="f">Nama pengguna<input name="user" maxlength="28" placeholder="Nama bendahara"></label>
    </div>
    <div class="logo-row"><span class="logo big"><img id="logoPrev" src="assets/logo.png" alt=""></span>
      <div class="tools"><button type="button" class="btn soft sm" id="gantiLogo">Ganti logo</button><button type="button" class="btn soft sm" id="resetLogo">Logo bawaan</button></div></div>
    <h3>Latar belakang</h3>
    <div class="bgs" id="bgs">
      <label><input type="radio" name="bg" value="ethereal"><span class="th" style="background:radial-gradient(80% 70% at 85% 0,#2a2350,transparent),linear-gradient(180deg,#0b0c1b,#15162e)"></span><em>Ethereal</em><small>bawaan</small></label>
      <label><input type="radio" name="bg" value="padang"><span class="th" style="background:linear-gradient(180deg,#02080a 0 55%,#0d5a2a 100%)"></span><em>Padang malam</em><small>animasi</small></label>
      <label><input type="radio" name="bg" value="senja"><span class="th" style="background:radial-gradient(80% 70% at 15% 0,#8d78ff,transparent),radial-gradient(70% 60% at 100% 100%,#ff9d7a,transparent),#0c0b18"></span><em>Senja ungu</em></label>
      <label><input type="radio" name="bg" value="tengah"><span class="th" style="background:radial-gradient(90% 60% at 50% 0,#4b3fa8,transparent),#08080f"></span><em>Tengah malam</em></label>
      <label><input type="radio" name="bg" value="zamrud"><span class="th" style="background:radial-gradient(70% 60% at 80% 0,#c9a60c,transparent),radial-gradient(80% 70% at 0 100%,#12a150,transparent),#031a10"></span><em>Zamrud</em></label>
      <label><input type="radio" name="bg" value="foto"><span class="th" id="thFoto"></span><em>Foto sendiri</em></label>
    </div>
    <div id="fotoBox" hidden>
      <button type="button" class="btn soft sm" id="pilihFoto">Pilih foto</button>
      <label class="f" style="margin-top:12px">Gelapkan foto: <b id="gelapVal">35</b>%<input type="range" name="gelap" min="0" max="85" step="5"></label>
    </div>
    <div class="act"><button type="button" class="btn soft" id="resetSet">Kembalikan bawaan</button><button class="btn lime">Selesai</button></div>
  </form>
</dialog>
<input type="file" id="fLogo" accept="image/*" hidden>
<input type="file" id="fFoto" accept="image/*" hidden>
<input type="file" id="berkas" accept="application/json" hidden>
<div id="cetak" aria-hidden="true"></div>
<div id="toast" role="status"></div>
<script src="langit.js"></script>
<script src="app.js"></script>
</body>
</html>
